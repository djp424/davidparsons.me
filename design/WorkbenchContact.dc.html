<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0E1113; }
    a { color: #9CC5CE; text-decoration: none; }
    a:hover { color: #C2E0E7; }
    .u { border-bottom: 1px solid rgba(156, 197, 206, 0.38); padding-bottom: 1px; }
    .u:hover { border-bottom-color: #9CC5CE; }
  </style>
</helmet>

<div style="position: relative; width: 1280px; min-height: 900px; background: #0E1113; color: #D8DEE0; display: flex; flex-direction: column; overflow: hidden;">

  <header style="border-bottom: 1px solid #232A2D; background: #151A1C;">
    <div style="max-width: 1040px; margin: 0 auto; padding: 0 40px; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
      <a href="#" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #EEF3F4;">david<span style="color: #5C696D;">parsons</span>.me</a>
      <div style="display: flex; align-items: center; gap: 28px;">
        <nav style="display: flex; gap: 24px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px;">
          <a href="#" style="color: #79878C;">Notes</a>
          <a href="#" style="color: #79878C;">Speaking</a>
          <a href="#" style="color: #EEF3F4; border-bottom: 1px solid #9CC5CE; padding-bottom: 3px;">Contact</a>
        </nav>
        <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 11px; border: 1px solid #232A2D; background: #1B2225; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #79878C;">
          <span style="color: #5C696D;">Jump to</span>
          <span style="color: #9CC5CE;">&#8984;K</span>
        </span>
      </div>
    </div>
  </header>
  <main style="max-width: 1040px; width: 100%; margin: 0 auto; padding: 72px 40px 80px; display: flex; flex-direction: column;">

    <div style="max-width: 560px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #D2A16A;">Contact</div>
      <h1 style="margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 36px; font-weight: 600; line-height: 1.15; letter-spacing: -0.028em; color: #EEF3F4;">You know what to do!</h1>
      <p style="margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.7; color: #79878C;">Write below and it lands in my inbox. I read everything.</p>
    </div>

    <div style="max-width: 560px; display: flex; flex-direction: column; gap: 22px; padding-top: 40px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;">

      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #79878C;">Name</span>
        <span style="display: block; border: 1px solid #232A2D; background: #151A1C; min-height: 48px; padding: 13px 15px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; color: #5C696D;">&nbsp;</span>
      </label>

      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #79878C;">Email</span>
        <span style="display: block; border: 1px solid #232A2D; background: #151A1C; min-height: 48px; padding: 13px 15px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; color: #5C696D;">&nbsp;</span>
      </label>
      </div>

      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #79878C;">Message</span>
        <span style="display: block; border: 1px solid #232A2D; background: #151A1C; min-height: 132px; padding: 13px 15px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; color: #5C696D;">&nbsp;</span>
      </label>
      <div style="display: flex; align-items: center; gap: 18px; padding-top: 6px;">
        <a href="#" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; background: #9CC5CE; color: #0E1113; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em;">Send message</a>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #5C696D;">Usually a reply within a day or two.</span>
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid #232A2D; margin-top: auto;">
    <div style="max-width: 1040px; margin: 0 auto; padding: 26px 40px; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #5C696D;">
      <span>Elsewhere</span>
      <span style="display: flex; gap: 22px;">
        <a href="#" style="color: #79878C;">Twitter</a>
        <a href="#" style="color: #79878C;">Github</a>
        <a href="#" style="color: #79878C;">LinkedIn</a>
      </span>
    </div>
  </footer>

</div>
</x-dc>
</body>
</html>
